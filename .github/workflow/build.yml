name: Build 5 FPS Mods

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build All Mods
        run: |
          mkdir -p output_mods
          build_mod() {
            MOD_ID=$1
            MOD_NAME=$2
            git clone https://github.com/FabricMC/fabric-example-mod.git $MOD_ID
            cd $MOD_ID
            chmod +x gradlew
            ./gradlew build --no-daemon
            JAR_FILE=$(ls build/libs/*.jar | grep -v "sources" | head -n 1)
            cp $JAR_FILE ../output_mods/${MOD_NAME}-1.0.0.jar
            cd ..
          }

          build_mod "entityboost" "EntityBoost"
          build_mod "particleswift" "ParticleSwift"
          build_mod "lagfreeram" "LagFreeRAM"
          build_mod "cullcraft" "CullCraft"
          build_mod "smoothframes" "SmoothFrames"

      - name: Download Mods
        uses: actions/upload-artifact@v3
        with:
          name: 5-FPS-Boost-Mods
          path: output_mods/*.jar
